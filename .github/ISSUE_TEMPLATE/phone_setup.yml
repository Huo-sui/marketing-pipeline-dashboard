name: Android Phone setup / Android Phone 安装
description: Get help with ADB, authorization, OEM drivers, Appium, or Phone Doctor. / 获取 ADB、授权、厂商驱动、Appium 或 Phone Doctor 帮助。
title: "[Phone]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Never paste an API key, full device serial, account handle, UI dump, or unreviewed Phone Doctor report. Login, CAPTCHA, consent, RSA authorization, and risk-control actions must remain on your physical phone.

        不要粘贴 API Key、完整设备序列号、账号 Handle、UI dump 或未经审查的 Phone Doctor 完整报告。登录、验证码、同意授权、RSA 授权和风控操作必须由你在实体手机完成。
  - type: input
    id: host
    attributes:
      label: Host system / 宿主系统
      placeholder: "Windows 11 24H2, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js and npm / Node.js 与 npm
      placeholder: "Node 24.x; npm 11.x"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone manufacturer and full model / 手机厂商与完整型号
      description: Do not include IMEI or serial number. / 不要包含 IMEI 或序列号。
      placeholder: "Google Pixel 9; Android 16"
    validations:
      required: true
  - type: dropdown
    id: state
    attributes:
      label: Current Phone Doctor state / 当前 Phone Doctor 状态
      options:
        - No ADB device / ADB 未发现设备
        - unauthorized
        - offline
        - Authorized device but ready=false / 已授权但 ready=false
        - Appium or UiAutomator2 failure / Appium 或 UiAutomator2 失败
        - Platform app or account setup / 平台 App 或账号设置
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: relevant_checks
    attributes:
      label: Relevant redacted checks / 相关脱敏检查项
      description: Include only `ready`, the failing check names/details, phone state, and next actions after manual review. / 人工检查后，只提供 ready、失败检查名/详情、Phone State 与 Next Actions。
      render: json
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What you already tried / 已尝试操作
      placeholder: "USB data cable, RSA approval, OEM driver source, adb restart, etc."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I removed keys, full serials, account identifiers, personal paths, screenshots, and UI data. / 我已删除 Key、完整序列号、账号标识、个人路径、截图和 UI 数据。
          required: true
