services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketing_pipeline
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: marketing
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - marketing_pipeline_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing_pipeline"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  marketing_pipeline_postgres_data:
